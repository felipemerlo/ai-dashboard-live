name: Build Android APK (TWA) - Debug

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_PACKAGE: com.news.aidashboard
      APP_NAME: "AI Dashboard Live"
      START_URL: "https://felipemerlo.github.io/ai-dashboard-live/"
    steps:
      - uses: actions/checkout@v4

      - name: Debug: show repo files
        run: |
          echo "### ROOT FILES"; ls -la
          echo "### reports dir"; ls -la reports/ai-dashboard-live || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Show Node/NPM versions
        run: node --version && npm --version

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Show Bubblewrap version
        run: npx @bubblewrap/cli --version || true

      - name: Create TWA manifest
        run: |
          cat > twa-manifest.json <<EOF
{
  "packageId": "${{ env.APP_PACKAGE }}",
  "applicationName": "${{ env.APP_NAME }}",
  "startUrl": "${{ env.START_URL }}",
  "launcherName": "${{ env.APP_NAME }}",
  "display": "standalone",
  "themeColor": "#ffffff",
  "backgroundColor": "#ffffff",
  "scope": "${{ env.START_URL }}"
}
EOF
          echo '--- twa-manifest.json ---'; cat twa-manifest.json

      - name: Init TWA project (non-interactive)
        run: |
          npx @bubblewrap/cli init --manifest=twa-manifest.json --output=twa --no-input || true
          echo 'Contents of twa folder:'; ls -la twa || true

      - name: Setup Android SDK
        uses: r0adkll/setup-android@v2
        with:
          api-level: 33
          target: android-33
          ndk: '25.1.8937393'

      - name: Debug: show gradle files
        run: |
          if [ -d twa/app ]; then ls -la twa/app || true; fi
          if [ -f twa/gradlew ]; then echo 'gradlew exists'; fi

      - name: Make gradlew executable
        run: |
          if [ -f twa/gradlew ]; then chmod +x twa/gradlew; fi

      - name: Build APK with stacktrace
        working-directory: twa
        run: |
          set -x
          ./gradlew assembleRelease --stacktrace || (echo 'GRADLE FAILED' && ./gradlew assembleRelease --stacktrace || true)
        continue-on-error: true

      - name: Collect gradle logs
        if: always()
        run: |
          mkdir -p /tmp/buildlogs
          if [ -d twa ]; then find twa -type f -name "*.log" -o -name "*.out" -maxdepth 5 -exec cp {} /tmp/buildlogs/ \; || true; fi
          ls -la /tmp/buildlogs || true

      - name: Upload APK and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-and-logs
          path: |
            twa/app/build/outputs/apk/release/*.apk
            twa/app/build/outputs/bundle/release/*.aab
            /tmp/buildlogs

