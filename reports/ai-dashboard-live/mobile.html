<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07101f" />
  <title>AI Dashboard Mobile</title>
  <link rel="stylesheet" href="mobile.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">AI Intelligence</p>
      <h1>Dashboard IA</h1>
      <p id="period" class="muted"></p>
    </div>
    <button id="refreshTop" class="icon-btn" aria-label="Atualizar">↻</button>
  </header>

  <main>
    <section class="summary-card">
      <button id="summaryToggle" class="section-toggle">Resumo executivo <span>⌄</span></button>
      <ul id="takeaways"></ul>
    </section>

    <section class="quick-panel">
      <div class="section-title">Categorias</div>
      <div id="categoryButtons" class="pill-row"></div>
      <div class="section-title">Subcategorias</div>
      <div id="subcategoryButtons" class="pill-row"></div>
    </section>

    <details class="filter-drawer">
      <summary>Filtros avançados</summary>
      <div class="filters">
        <label>Data inicial<input id="dateFrom" type="date" /></label>
        <label>Data final<input id="dateTo" type="date" /></label>
        <label>Fonte<select id="sourceSelect"><option value="">Todas as fontes</option></select></label>
        <label>Busca livre<input id="textSearch" type="search" placeholder="Ex.: agentes, privacidade..." /></label>
      </div>
    </details>

    <div id="status" class="status"></div>
    <section id="cards" class="cards"></section>
  </main>

  <nav class="bottom-actions">
    <button id="updateBtn" class="primary">Atualizar buscas</button>
    <button id="clearFilters">Limpar filtros</button>
    <a href="/" class="desktop-link">Notebook</a>
  </nav>

  <script src="mobile.js"></script>
</body>
</html>
